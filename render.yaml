# Arquivo: render.yaml  (Render > New > Blueprint, apontando para o repositório do GitHub)
# Cria o banco PostgreSQL e o serviço da API. Confira no site do Render os planos e limites atuais.

databases:
  - name: commandiz-db
    databaseName: commandiz
    plan: free

services:
  - type: web
    name: commandiz-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /saude
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DEBUG_MODE
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: commandiz-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"
      - key: ADMIN_EMAILS
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USUARIO
        sync: false
      - key: SMTP_SENHA
        sync: false
      - key: SMTP_REMETENTE
        sync: false
